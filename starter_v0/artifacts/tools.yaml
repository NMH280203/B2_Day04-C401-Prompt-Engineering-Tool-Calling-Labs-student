# Tool declarations — routing tuned for base eval.
tools:
  - name: clarify
    description: |
      Ask the user one question and wait for the next turn. Use when required info is missing.
      - Missing Twitter handle/account for a tweet request → clarify with response_type=text.
      - Missing URL for "this article" → clarify with response_type=text.
      - Before send/post/publish to Telegram → clarify with response_type=yes_no (confirm intent), never use text for that case.
      Do NOT guess handles or URLs.
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "text=missing info; yes_no=confirm send/post"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: |
      Recent posts from ONE Twitter/X account. Requires screenname (handle without @).
      Use when user names a person/account (e.g. Sam Altman → sama, Elon Musk → elonmusk).
      Do NOT use if no account is given — use clarify instead.
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Twitter handle, e.g. sama, elonmusk"}
        limit: {type: integer, default: 5, description: "Số bài đăng"}
      required: [screenname]

  - name: social_search
    description: |
      Search Twitter/X by keyword/topic (not a specific user). Use when user asks what people say about a topic on Twitter.
      Do NOT use for web news only. Do NOT combine with lookup unless the user explicitly asks for BOTH web news AND tweets in one request.
      search_type: Latest (default) or Top when user wants popular/top tweets.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Top = phổ biến"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: |
      Web search via Tavily. Use for news or general web when no URL is provided.
      topic=news for tin tức/thời sự; topic=general otherwise.
      timeframe: day (hôm nay), week (tuần này), month, year.
      query should be the subject keyword only (e.g. AI, robotics, OpenAI).
      Use ONLY lookup (no social_search) unless user explicitly wants both web and Twitter.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chủ đề tìm kiếm"}
        topic: {type: string, enum: [general, news], default: "general", description: "news cho tin tức"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: Read full content of a specific URL the user provided. Do not use for missing URLs — use clarify.
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "URL đầy đủ"}
      required: [url]

  - name: dedupe
    description: |
      Remove duplicate items from a list (same URL or title). Local formatter only.
      Use when the user asks to deduplicate/drop duplicates before format or digest.
      Requires items array from prior tool results.
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Items to deduplicate"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
        by: {type: string, enum: [url, title], default: "url", description: "Dedupe key"}
      required: [items]

  - name: format
    description: Format a list of items into a markdown digest. Use after collecting items from other tools.
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  - name: send
    description: |
      Post text to Telegram. Side-effect tool.
      Only call with confirmed=true after user explicitly agreed in conversation.
      For "đăng/gửi/post lên Telegram" requests, call clarify with yes_no first — never send on first turn.
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "true only after user confirmed"}
      required: [text]

  - name: policy
    description: Search internal company policy markdown. Use for compliance, publishing, citation, privacy, tool usage rules.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: Search arXiv papers by keyword. No API key required.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: Extract text from an arXiv paper by ID or URL.
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "arXiv ID hoặc URL"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]
